# Frontal du mode application (généré par start.sh : __PORT__, __XPRA_PORT__).
# nginx sert lui-même les fichiers du client HTML5 d'Xpra et ne passe à Xpra
# (127.0.0.1, avec son mot de passe) que le WebSocket et les chemins dynamiques.
# Servis directement par Xpra, une partie des fichiers revenait en 502 dans
# certains navigateurs : nginx répond en gzip comme pour le terminal et absorbe
# les connexions de l'ingress.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    include /etc/nginx/mime.types;
    # Le paquet xpra-html5 fournit des versions .gz précompressées
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript text/plain application/json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen __PORT__;
        absolute_redirect off;
        root /usr/share/xpra/www;
        index index.html;

        location / {
            # Le client ouvre son WebSocket sur l'adresse de la page elle-même
            error_page 418 = @xpra;
            if ($http_upgrade != "") { return 418; }
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ @xpra;
        }

        location @xpra {
            proxy_pass http://127.0.0.1:__XPRA_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            client_max_body_size 0;
        }
    }
}
