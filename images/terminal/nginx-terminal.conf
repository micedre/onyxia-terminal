# Frontal du terminal web (généré par start.sh : __PORT__, __TOKEN__).
# - /login   : page de connexion (mot de passe seul), qui pose le cookie
#              onyxia_terminal = SHA-256(sel:mot de passe)
# - /terminal/ : ttyd (socket unix privée, sans auth propre), servi seulement avec le bon cookie
# - /        : 200 avec une page qui renvoie vers terminal/. Pas de 302 : les
#              sondes HTTP (chart vscode-python) suivent les redirections.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    types {
        text/html html;
        font/ttf  ttf;
    }
    gzip on;
    gzip_types font/ttf;

    # Le jeton (64 caractères hexadécimaux) dépasse la taille de case par
    # défaut ; à déclarer avant le premier bloc map
    map_hash_bucket_size 128;
    # error_page dans les blocs @proxy_v6 (repli IPv6 puis page d'erreur)
    recursive_error_pages on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $cookie_onyxia_terminal $authed {
        default     0;
        "__TOKEN__" 1;
    }

    server {
        listen __PORT__;
        # Redirections relatives : derrière l'ingress HTTPS, pas de http://hôte:8080
        absolute_redirect off;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><meta http-equiv="refresh" content="0; url=terminal/"><a href="terminal/">Terminal</a>\n';
        }

        location = /login {
            default_type text/html;
            add_header Cache-Control "no-store";
            alias /tmp/onyxia-terminal/login.html;
        }

        # Police d'icônes (Nerd Font), publique : pas de cookie exigé
        location /fonts/ {
            alias /opt/fonts/;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location = /logout {
            add_header Set-Cookie "onyxia_terminal=; Path=/; Max-Age=0; SameSite=Lax";
            return 302 /login;
        }

        location = /terminal { return 302 /terminal/; }

        # Serveurs web lancés dans le terminal (localhost:PORT), comme code-server :
        #  - /proxy/PORT/chemin    → http://127.0.0.1:PORT/chemin (préfixe retiré)
        #  - /absproxy/PORT/chemin → http://127.0.0.1:PORT/absproxy/PORT/chemin
        #    (applications réglées avec ce chemin de base)
        # Repli sur [::1] (Node écoute souvent sur « localhost » en IPv6 seulement).
        # Ports interdits : ce frontal et les proxys des sessions agent.
        location ~ "^/proxy/(?<pport>[0-9]{2,5})(?<prest>/.*)?$" {
            set $p $pport;
            set $prefix /proxy/$pport;
            if ($authed = 0)                   { return 302 /login?next=$request_uri; }
            if ($p ~ "^(__PORT__|8888|4000)$") { return 403; }
            if ($prest = "")                   { return 302 /proxy/$p/$is_args$args; }
            rewrite ^/proxy/[0-9]+(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:$p;
            # Redirections de l'application (/chemin, http://localhost:PORT/chemin)
            proxy_redirect ~^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:[0-9]+)?/(.*)$ $prefix/$3;
            proxy_redirect ~^/(.*)$ $prefix/$1;
            include /opt/onyxia-terminal/nginx-proxy-common.conf;
            error_page 502 = @proxy_v6;
        }
        location ~ "^/absproxy/(?<pport>[0-9]{2,5})(?<prest>/.*)?$" {
            set $p $pport;
            set $prefix "";
            if ($authed = 0)                   { return 302 /login?next=$request_uri; }
            if ($p ~ "^(__PORT__|8888|4000)$") { return 403; }
            if ($prest = "")                   { return 302 /absproxy/$p/$is_args$args; }
            proxy_pass http://127.0.0.1:$p;
            proxy_redirect ~^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:[0-9]+)?/(.*)$ /$3;
            include /opt/onyxia-terminal/nginx-proxy-common.conf;
            error_page 502 = @absproxy_v6;
        }
        location @proxy_v6 {
            rewrite ^/proxy/[0-9]+(/.*)$ $1 break;
            proxy_pass http://[::1]:$p;
            proxy_redirect ~^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(:[0-9]+)?/(.*)$ $prefix/$3;
            proxy_redirect ~^/(.*)$ $prefix/$1;
            include /opt/onyxia-terminal/nginx-proxy-common.conf;
            error_page 502 = @proxy_down;
        }
        location @absproxy_v6 {
            proxy_pass http://[::1]:$p;
            proxy_redirect ~^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(:[0-9]+)?/(.*)$ /$3;
            include /opt/onyxia-terminal/nginx-proxy-common.conf;
            error_page 502 = @proxy_down;
        }
        location @proxy_down {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            return 502 '<!doctype html><meta charset="utf-8"><title>Port $p</title><body style="font:15px system-ui,sans-serif;max-width:40em;margin:3em auto;padding:0 1em"><h2>Rien n\'écoute sur le port $p</h2><p>Lancez le serveur dans le terminal, à l\'écoute de <code>127.0.0.1</code> ou <code>0.0.0.0</code>, puis rechargez la page. La commande <code>ports</code> liste les ports ouverts.</p>\n';
        }

        location /terminal/ {
            if ($authed = 0) { return 302 /login; }
            proxy_pass http://unix:/tmp/onyxia-terminal/ttyd.sock;
            proxy_http_version 1.1;
            # Hôte tel qu'envoyé (avec le port) : ttyd --check-origin le compare à Origin
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
