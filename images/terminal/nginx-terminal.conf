# Frontal du terminal web (généré par start.sh : __PORT__, __TOKEN__).
# - /login   : page de connexion (mot de passe seul), qui pose le cookie
#              onyxia_terminal = SHA-256(sel:mot de passe)
# - /terminal/ : ttyd, local et sans auth propre, servi seulement avec le bon cookie
# - /        : 200 avec une page qui renvoie vers terminal/. Pas de 302 : les
#              sondes HTTP (chart vscode-python) suivent les redirections.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Le jeton (64 caractères hexadécimaux) dépasse la taille de case par
    # défaut ; à déclarer avant le premier bloc map
    map_hash_bucket_size 128;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $cookie_onyxia_terminal $authed {
        default     0;
        "__TOKEN__" 1;
    }

    server {
        listen __PORT__;
        # Redirections relatives : derrière l'ingress HTTPS, pas de http://hôte:8080
        absolute_redirect off;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><meta http-equiv="refresh" content="0; url=terminal/"><a href="terminal/">Terminal</a>\n';
        }

        location = /login {
            default_type text/html;
            add_header Cache-Control "no-store";
            alias /tmp/onyxia-terminal/login.html;
        }

        location = /logout {
            add_header Set-Cookie "onyxia_terminal=; Path=/; Max-Age=0; SameSite=Lax";
            return 302 /login;
        }

        location = /terminal { return 302 /terminal/; }

        location /terminal/ {
            if ($authed = 0) { return 302 /login; }
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            # Hôte tel qu'envoyé (avec le port) : ttyd --check-origin le compare à Origin
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
