# Frontal utilisé quand l'image est lancée par le chart vscode-python : ses
# sondes font un GET / sans authentification, que ttyd refuserait (401).
# « / » répond donc 200 avec une page qui renvoie vers /terminal/, servi par
# ttyd (qui garde son auth). Pas de 302 : les sondes suivent les redirections.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen __PORT__;
        # Redirections relatives : derrière l'ingress HTTPS, pas de http://hôte:8080
        absolute_redirect off;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><meta http-equiv="refresh" content="0; url=terminal/"><a href="terminal/">Terminal</a>\n';
        }
        location = /terminal { return 302 /terminal/; }

        location /terminal/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            # Hôte tel qu'envoyé (avec le port) : ttyd --check-origin le compare à Origin
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
