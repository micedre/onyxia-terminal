# ~/.tmux.conf — terminal web SSP Cloud

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on                 # Maj + sélection pour copier vers le navigateur
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on     # nécessaire pour trzsz et les images dans tmux

# Découpages intuitifs, dans le dossier courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf rechargé"

# Barre d'état sobre
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold] #S "
set -g status-right " $KUBERNETES_NAMESPACE | %H:%M "   # variable posée par onyxia-init.sh
set -g status-interval 30
setw -g window-status-current-style "fg=colour39,bold"
