# ~/.tmux.conf — terminal web SSP Cloud

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on     # nécessaire pour trzsz et les images dans tmux

# Presse-papiers : chaque copie (sélection à la souris, double/triple clic,
# y en mode copie, Neovim) est envoyée au navigateur en OSC 52, que la page
# du terminal écrit dans le presse-papiers (voir terminal-page.js)
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"
# Mode copie vi : la sélection inclut le caractère sous la souris (en emacs,
# mode par défaut ici, le dernier caractère glissé était perdu)
set -g mode-keys vi
# Double clic = mot entier, coupé seulement aux espaces, guillemets et
# parenthèses : jetons base64 (+ / =), URL, chemins, user@hôte:port
set -g word-separators " \"'`()[]{}<>,;|"

# Découpages intuitifs, dans le dossier courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf rechargé"

# Aide : Alt+h, préfixe + ?, bouton [?] de la barre d'état, menu du clic droit
bind -n M-h display-popup -E -w 84 -h 80% -T " Aide · q pour fermer " /opt/onyxia-terminal/aide.sh
bind ?      display-popup -E -w 84 -h 80% -T " Aide · q pour fermer " /opt/onyxia-terminal/aide.sh

# Raccourcis sans préfixe avec Alt (le navigateur garde Ctrl+T, Ctrl+W...)
bind -n M-t     new-window -c "#{pane_current_path}"
bind -n M-Enter split-window -h -c "#{pane_current_path}"
bind -n M--     split-window -v -c "#{pane_current_path}"
bind -n M-w     confirm-before -p "Fermer ce panneau ? (y/n)" kill-pane
bind -n M-z     resize-pane -Z
bind -n M-m     run-shell -b "/opt/onyxia-terminal/theme.sh toggle"   # thème clair / sombre
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Barre d'état sobre, façon onglets, avec des boutons cliquables
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold] #S "
set -g status-right "#[range=user|help] [?] aide #[norange]#[range=user|theme] [◐] #[norange]#[range=user|upload] [↑] #[norange]#[range=user|download] [↓] #[norange]#[range=user|new] [+] #[norange]#[range=user|splith] [⫼] #[norange]#[range=user|splitv] [⊟] #[norange] $KUBERNETES_NAMESPACE | %H:%M "   # variable posée par onyxia-init.sh
set -g status-right-length 100
set -g status-interval 30
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=colour39,bold,reverse"

# Clic dans la barre : boutons [?] / [◐] / [↑] / [↓] / [+] / [⫼] / [⊟], sinon sélection de l'onglet
bind -n MouseDown1Status {
    if -F "#{==:#{mouse_status_range},help}"   { display-popup -E -w 84 -h 80% -T " Aide · q pour fermer " /opt/onyxia-terminal/aide.sh } {
    if -F "#{==:#{mouse_status_range},theme}"    { run-shell -b "/opt/onyxia-terminal/theme.sh toggle" } {
    if -F "#{==:#{mouse_status_range},upload}"   { split-window -v -l 8 -c "#{pane_current_path}" "/opt/onyxia-terminal/transfert.sh envoyer" } {
    if -F "#{==:#{mouse_status_range},download}" { split-window -v -l 15 -c "#{pane_current_path}" "/opt/onyxia-terminal/transfert.sh recuperer" } {
    if -F "#{==:#{mouse_status_range},new}"    { new-window -c "#{pane_current_path}" } {
    if -F "#{==:#{mouse_status_range},splith}" { split-window -h -c "#{pane_current_path}" } {
    if -F "#{==:#{mouse_status_range},splitv}" { split-window -v -c "#{pane_current_path}" } {
        select-window -t =
    } } } } } } }
}

# Clic droit : menu en français (le navigateur n'affiche pas le sien, sauf
# avec Maj). Si l'application gère la souris (Neovim...), le clic lui revient.
# -O : le menu reste ouvert quand on relâche le bouton
bind -n MouseDown3Pane {
    if -F "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" {
        select-pane -t = ; send -M
    } {
        display-menu -O -t = -xM -yM -T " Terminal " \
            "Aide"                       h { display-popup -E -w 84 -h 80% -T " Aide · q pour fermer " /opt/onyxia-terminal/aide.sh } \
            "" \
            "Coller la dernière copie"   p { paste-buffer -p } \
            "Thème clair / sombre"       m { run-shell -b "/opt/onyxia-terminal/theme.sh toggle" } \
            "" \
            "Envoyer des fichiers ici"   e { split-window -v -l 8 -c "#{pane_current_path}" "/opt/onyxia-terminal/transfert.sh envoyer" } \
            "Télécharger des fichiers…"  r { split-window -v -l 15 -c "#{pane_current_path}" "/opt/onyxia-terminal/transfert.sh recuperer" } \
            "" \
            "Nouvel onglet"              t { new-window -c "#{pane_current_path}" } \
            "Session agent isolée"       a { new-window -c "#{pane_current_path}" "agent-session --here; echo; read -rp 'Session terminée, Entrée pour fermer.'" } \
            "Diviser à droite"           d { split-window -h -c "#{pane_current_path}" } \
            "Diviser en dessous"         b { split-window -v -c "#{pane_current_path}" } \
            "#{?window_zoomed_flag,Dézoomer,Zoomer} le panneau" z { resize-pane -Z } \
            "" \
            "Fermer le panneau"          x { kill-pane }
    }
}

# Glisser-déposer de fichiers sur la page : terminal-page.js envoie cette
# séquence (au lieu du Ctrl+C de trzsz.js), qui ouvre un panneau de réception
# dans le dossier du panneau actif, quel que soit le programme qui y tourne
set -s user-keys[0] "\e[7999~"
bind -n User0 split-window -v -l 8 -c "#{pane_current_path}" "/opt/onyxia-terminal/transfert.sh depot"

# Titre = dossier du panneau actif : la page l'affiche pendant un
# glisser-déposer (l'onglet du navigateur garde son titre, fixé par ttyd)
set -g set-titles on
set -g set-titles-string "#{pane_current_path}"

# Thème clair / sombre : la page (terminal-page.js) le choisit et l'annonce
# par une touche ; @theme sert à Neovim (au lancement et en direct)
run-shell 'tmux set -g @theme "$([ "$DARK_MODE" = true ] && echo dark || echo light)"'
set -s user-keys[1] "\e[7998~"
set -s user-keys[2] "\e[7997~"
bind -n User1 { set -g @theme light ; run-shell -b "/opt/onyxia-terminal/theme.sh sync light" }
bind -n User2 { set -g @theme dark  ; run-shell -b "/opt/onyxia-terminal/theme.sh sync dark" }
# À l'ouverture de la page, elle annonce son thème (après chargement de son script)
set-hook -g client-attached 'run-shell -b "sleep 2; /opt/onyxia-terminal/theme.sh hello"'
set-hook -g session-created 'run-shell -b "sleep 2; /opt/onyxia-terminal/theme.sh hello"'
