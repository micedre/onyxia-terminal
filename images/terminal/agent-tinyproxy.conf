# Proxy HTTP(S) des sessions agent (généré par agent-session, __RT__ = dossier
# d'exécution). Seuls les domaines de la liste __ALLOW__ sont joignables ;
# chaque requête est journalisée (agent-session log).
Port 8888
Listen 127.0.0.1
Timeout 600
PidFile "__RT__/tinyproxy.pid"
LogFile "__RT__/tinyproxy.log"
LogLevel Info
MaxClients 50
DisableViaHeader Yes
ConnectPort 443
ConnectPort 80
Filter "__ALLOW__"
FilterType fnmatch
FilterDefaultDeny Yes
FilterURLs Off
