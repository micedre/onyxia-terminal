# Proxy LLM des sessions agent (généré par agent-session, __RT__ = dossier d'exécution).
# Lancé avec l'utilisateur onyxia, hors de la session agent : il ajoute la vraie
# clé d'API, que l'agent ne voit jamais. Routes (une par fournisseur) :
# __RT__/llm-routes.conf ; chaque appel est journalisé (agent-session log).
pid __RT__/llm-nginx.pid;
error_log __RT__/llm-nginx.log warn;

events {}

http {
    log_format agent '$time_iso8601 LLM $request_method $uri $status ${body_bytes_sent}o ${request_time}s';
    access_log __RT__/llm-access.log agent;
    client_body_temp_path __RT__/nginx-client;
    proxy_temp_path       __RT__/nginx-proxy;
    fastcgi_temp_path     __RT__/nginx-fastcgi;
    uwsgi_temp_path       __RT__/nginx-uwsgi;
    scgi_temp_path        __RT__/nginx-scgi;
    client_max_body_size  64m;

    server {
        listen 127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_buffering off;          # réponses en flux (streaming)
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        include __RT__/llm-routes.conf;

        location / { return 404 "agent-session : fournisseur inconnu\n"; }
    }
}
