name: Build and publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute registry and version
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
          fi
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push onyxia-terminal
        uses: docker/build-push-action@v6
        with:
          context: images/terminal
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/onyxia-terminal:${{ env.VERSION }}
            ${{ env.REGISTRY }}/onyxia-terminal:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=terminal
          cache-to: type=gha,mode=max,scope=terminal

      # xpra and archi need their parent image pulled from the registry,
      # so they are only built when pushing (not on pull requests).
      - name: Build and push onyxia-xpra
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/xpra
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/onyxia-terminal:${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/onyxia-xpra:${{ env.VERSION }}
            ${{ env.REGISTRY }}/onyxia-xpra:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=xpra
          cache-to: type=gha,mode=max,scope=xpra

      - name: Build and push onyxia-app-archi
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/archi
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/onyxia-xpra:${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/onyxia-app-archi:${{ env.VERSION }}
            ${{ env.REGISTRY }}/onyxia-app-archi:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=archi
          cache-to: type=gha,mode=max,scope=archi
