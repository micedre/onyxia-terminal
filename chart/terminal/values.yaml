# Valeurs par défaut du service "terminal" (Onyxia / SSP Cloud)
global:
  suspend: false

service:
  initContainer:
    image: "inseefrlab/onyxia-base:latest"
    pullPolicy: IfNotPresent
  image:
    # TODO : remplacer par ton registre (Docker Hub, GHCR...)
    version: "ghcr.io/votre-org/onyxia-terminal:0.1.0"
    pullPolicy: IfNotPresent
    custom:
      enabled: false
      version: "ghcr.io/votre-org/onyxia-terminal:0.1.0"

# Ce que lance le service (exposé dans l'UI Onyxia) :
#   terminal    -> terminal web ttyd (image service.image.version)
#   application -> une application graphique via Xpra (image apps.<app>.image)
launcher:
  mode: "terminal"
  app: "archi"

# Catalogue des applications graphiques (non affiché dans l'UI).
# Pour en ajouter une : construire son image à partir de onyxia-xpra, ajouter
# une entrée ici et sa clé dans launcher.app.listEnum du values.schema.json.
apps:
  archi:
    image: "ghcr.io/votre-org/onyxia-app-archi:0.1.0"
    command: "/usr/local/bin/archi"

# Options propres au terminal (exposées dans l'UI Onyxia)
terminal:
  shell: "zsh"            # zsh | bash
  multiplexer: "tmux"     # tmux | none
  fontSize: 14

security:
  password: "changeme"
  networkPolicy:
    enabled: false
    from: []
  allowlist:
    enabled: false
    ip: "0.0.0.0/0"

init:
  standardInitPath: "/opt/onyxia-init.sh"
  regionInit: ""
  regionInitCheckSum: ""
  personalInit: ""
  personalInitArgs: ""

extraEnvVars: []

s3:
  enabled: false
  secretName: ""
  accessKeyId: ""
  endpoint: ""
  defaultRegion: ""
  secretAccessKey: ""
  sessionToken: ""
  pathStyleAccess: false
  workingDirectoryPath: ""

vault:
  enabled: false
  secretName: ""
  token: ""
  url: ""
  mount: ""
  secret: ""
  directory: ""

git:
  enabled: true
  secretName: ""
  name: ""
  email: ""
  cache: ""
  token: ""
  repository: ""
  branch: ""

replicaCount: 1
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

environment:
  user: onyxia
  group: users

kubernetes:
  enabled: true
  role: "view"

podAnnotations: {}

podSecurityContext:
  fsGroup: 100

securityContext: {}

networking:
  type: ClusterIP
  clusterIP: None
  service:
    port: 7681
  user:
    enabled: false
    port: 5000
    ports: []

ingress:
  enabled: false
  tls: true
  ingressClassName: ""
  # Les WebSockets d'un terminal restent ouvertes longtemps : on relève les
  # timeouts nginx (ttyd envoie aussi un ping toutes les 30 s).
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hostname: chart-example.local
  userHostname: chart-example-user.local
  path: /
  userPath: /
  useCertManager: false
  certManagerClusterIssuer: ""
  useTlsSecret: false
  tlsSecretName: ""

route:
  enabled: false
  annotations: []
  hostname: chart-example.local
  userHostname: chart-example-user.local
  tls:
    termination: edge
  wildcardPolicy: None

resources: {}

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  # existingClaim: ""

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

startupProbe:
  failureThreshold: 60
  initialDelaySeconds: 5
  periodSeconds: 5
  successThreshold: 1
  timeoutSeconds: 2

ai:
  enabled: false
  secretName: "" # Généré à partir du nom du service si vide
  selectedModel: ""
  providers: []

userPreferences:
  darkMode: false
  language: "en"

openshiftSCC:
  enabled: false
  scc: ""

proxy:
  enabled: false
  noProxy: ""
  httpProxy: ""
  httpsProxy: ""

certificates: {}

message:
  fr: ""
  en: ""

runtimeClassName: ""
